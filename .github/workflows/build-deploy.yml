name: Build & deploy

on:
  repository_dispatch:
    types: [content-changed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Never cancel a running deploy; queued runs pick up whatever is dirty by then.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SITE_URL: ${{ vars.SITE_URL }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  PUBLIC_BOT_USERNAME: ${{ vars.PUBLIC_BOT_USERNAME }}
  # The search island loads pagefind.js from R2 (uploaded by sync-pagefind.ts).
  PUBLIC_PAGEFIND_URL: ${{ vars.R2_PUBLIC_URL }}/pagefind

jobs:
  deploy:
    # Forks without Cloudflare configured skip this job instead of failing.
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Check dirty flag
        id: dirty
        working-directory: apps/bot
        run: |
          value=$(pnpm exec wrangler d1 execute tgbox --remote --json \
            --command "SELECT value FROM site_state WHERE key = 'dirty_since'" \
            | jq -r '.[0].results[0].value // empty')
          echo "dirty_since=${value:-none}"
          if [ -n "$value" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Site is clean; nothing to build."
          fi

      - name: Export D1, snapshot, astro build, Pagefind
        if: steps.dirty.outputs.build == 'true'
        run: node scripts/build-site.ts --remote --media-base-url "$R2_PUBLIC_URL"

      - name: Upload new Pagefind files to R2
        if: steps.dirty.outputs.build == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/sync-pagefind.ts upload

      - name: Deploy web
        if: steps.dirty.outputs.build == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy

      - name: Delete stale Pagefind files from R2
        if: steps.dirty.outputs.build == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/sync-pagefind.ts prune

      # Changes made after this build started keep the flag for the next run.
      - name: Clear dirty flag
        if: steps.dirty.outputs.build == 'true'
        working-directory: apps/bot
        run: |
          pnpm exec wrangler d1 execute tgbox --remote \
            --command "DELETE FROM site_state WHERE key = 'dirty_since' AND CAST(value AS INTEGER) < $BUILD_STARTED_AT"
