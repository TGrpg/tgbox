name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Typecheck + test scripts
        run: |
          pnpm exec tsc -p scripts
          node --test "scripts/**/*.test.ts"
